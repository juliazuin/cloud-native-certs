apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
  labels:
    run: secret-pod
spec:
  containers:
    - name: secret-pod
      image: busybox
      command:
        - sh
        - -c
        - echo "The app is running!" && sleep 3600
      resources: {}
      volumeMounts:
        - name: secret-vol
          readOnly: true
          mountPath: "/etc/secret-vol"
  volumes:
    - name: secret-vol
      secret:
        secretName: dev-login
  dnsPolicy: ClusterFirst
  restartPolicy: Always
